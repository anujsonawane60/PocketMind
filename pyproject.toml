[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketmind"
version = "0.2.0"
description = "Portable, private, local-first AI assistant that lives on a USB drive"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "psutil>=6,<8",
  "cryptography>=43,<47",
  "argon2-cffi>=23,<26",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
pocketmind = "pocketmind.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["apps/backend"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.packages.find]
where = ["apps/backend"]

[tool.setuptools.package-data]
pocketmind = ["static/*"]
